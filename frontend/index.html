<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 数据查询平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/>
          <path d="M18 17V9"/>
          <path d="M13 17V5"/>
          <path d="M8 17v-3"/>
        </svg>
      </span>
      <h1>AI 数据查询平台</h1>
    </div>
    <div class="header-right">
      <span id="ds-count" class="badge subtle">0 个数据集</span>
    </div>
  </header>

  <main class="layout chat-only">
    <!-- 全幅 AI 对话：自然语言提问 → AI 写只读 SQL → 图表/表格回答 -->
    <section class="panel chat-panel" style="padding:0;overflow:hidden;">
      <iframe src="widget.html" title="AI 数据助手" style="width:100%;height:100%;border:none;display:block;"></iframe>
    </section>
  </main>

  <script>
    // 仅加载右上角数据集计数（对话本体在 iframe 内）。
    fetch('/dq/datasets').then(r => r.ok ? r.json() : null).then(list => {
      if (Array.isArray(list)) {
        const el = document.getElementById('ds-count');
        if (el) el.textContent = list.length + ' 个数据集';
      }
    }).catch(() => {});
  </script>
</body>
</html>
