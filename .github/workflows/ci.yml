name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1
        env:
          # 集成测试在 CI 中自动跳过（未设置 DQ_DM_TEST / DQ_DM_LINK / DQ_LLM_KEY）
          DQ_SKIP_INTEGRATION: '1'

  frontend:
    name: Frontend bundle size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build widget bundle
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Enforce gzip size budget (≤ 40KB)
        working-directory: frontend
        run: |
          SIZE=$(gzip -c dist/dq-widget.js | wc -c)
          LIMIT=$((40 * 1024))
          echo "gzip size: $SIZE bytes (limit: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::widget bundle gzip $SIZE bytes exceeds 40KB budget"
            exit 1
          fi
